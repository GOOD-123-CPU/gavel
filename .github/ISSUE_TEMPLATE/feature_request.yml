name: ✨ Feature Request
description: Suggest an idea for Gavel
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to achieve? What's missing?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Admin console (Vue)
        - Storefront (jQuery)
        - Security
        - Documentation
        - Deployment (Docker/CI)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to contribute
      options:
        - label: I am willing to submit a PR for this feature

name: 🐛 Bug Report
description: Report a problem with Gavel
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `docker compose up -d`
        2. Open `/auction-items/list`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: How are you running Gavel?
      options:
        - Docker Compose
        - Local (java -jar)
        - Local (mvn spring-boot:run)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gavel version
      placeholder: v2.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell

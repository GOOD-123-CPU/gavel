# Dependabot policy: keep security updates responsive while batching routine version churn.
version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      routine-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/server/src/main/resources/admin/admin"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      routine-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      routine-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

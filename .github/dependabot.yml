version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/server"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/server/src/main/resources/admin/admin"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "frontend"
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
